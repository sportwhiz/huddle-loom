name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable-canvas-conformance
          POSTGRES_DB: canvas_auth_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy --dry-run
      - name: Native authentication, revocation, rotation and restore
        run: pnpm --filter @whiteboard/web exec node scripts/run-auth-tests.mjs
      - name: Install Chromium for native OAuth browser regression
        run: pnpm --filter @whiteboard/web exec playwright install --with-deps chromium
      - name: Product guides, verification policy and update notices
        run: |
          HUDDLE_BUILD_TARGET=node pnpm --filter @whiteboard/web exec vite --host 127.0.0.1 --port 5300 --strictPort > /tmp/huddle-ui-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5300/ > /dev/null; then break; fi
            sleep 0.25
          done
          pnpm --filter @whiteboard/web exec node scripts/update-notice-ui-smoke.mjs
          pnpm --filter @whiteboard/web exec node scripts/reauthentication-ui-smoke.mjs
          UI_ORIGIN=http://127.0.0.1:5300 pnpm --filter @whiteboard/web exec node scripts/tour-ui-smoke.mjs
      - name: Native OAuth browser consent and MCP connection
        run: pnpm --filter @whiteboard/web run test:oauth-browser
      - name: PostgreSQL authentication adapter
        run: pnpm --filter @whiteboard/web run test:auth-postgres
      - name: Native deployment artifact
        run: WHITEBOARD_WRANGLER_CONFIG=wrangler.native.jsonc pnpm run build
      - run: pnpm exec wrangler deploy --dry-run
